<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar respuesta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
    <div class="contenedor">
        <h2>✏️ Editar respuesta automática</h2>

        <form method="POST">
            <label for="mensaje">Mensaje:</label>
            <input type="text" name="mensaje" value="{{ regla.mensaje }}" required>

            <label for="respuesta">Respuesta:</label>
            <input type="text" name="respuesta" value="{{ regla.respuesta }}" required>

            <button type="submit">Guardar cambios</button>
        </form>

        <p><a href="{{ url_for('respuestas') }}">⬅ Volver a mis reglas</a></p>
    </div>
</body>
</html>
